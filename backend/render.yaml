# ========================================================
# Render Infrastructure as Code (Blueprint) Specification
# Cafe Menu & Order Management System API (Backend-Root Blueprint)
# ========================================================
services:
  - type: web
    name: cafe-management-api
    env: node
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
